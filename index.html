<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nexus Reseller Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #0d1117);
            min-height: 100vh;
            color: #fff;
        }
        .app-container { max-width: 500px; margin: 0 auto; min-height: 100vh; background: linear-gradient(135deg, #0a0a0f, #0d1117); position: relative; }
        .status-bar { padding: 12px 20px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.3); }
        .app-header { padding: 24px 20px; text-align: center; border-bottom: 1px solid rgba(255,0,0,0.2); background: linear-gradient(135deg, rgba(255,0,0,0.1), rgba(0,0,0,0.3)); }
        .app-logo { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #ff0000, #ff4444); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .app-subtitle { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        
        .coin-card { background: linear-gradient(135deg, #1a1a2e, #0d0d1a); margin: -20px 20px 20px 20px; border-radius: 24px; padding: 20px; border: 1px solid rgba(255,0,0,0.3); }
        .coin-balance { font-size: 48px; font-weight: 800; color: #ffd700; margin-bottom: 4px; }
        .coin-label { font-size: 12px; color: rgba(255,255,255,0.5); }
        
        .tab-bar { display: flex; padding: 8px 20px; gap: 16px; background: rgba(0,0,0,0.4); }
        .tab-item { flex: 1; text-align: center; padding: 12px; border-radius: 30px; font-weight: 600; font-size: 14px; cursor: pointer; color: rgba(255,255,255,0.5); transition: all 0.2s; }
        .tab-item i { margin-right: 8px; }
        .tab-item.active { background: linear-gradient(135deg, #ff0000, #cc0000); color: white; }
        
        .app-content { padding: 20px; padding-bottom: 100px; }
        .card { background: rgba(20,25,40,0.7); backdrop-filter: blur(10px); border-radius: 24px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(255,0,0,0.2); }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #ff0000; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
        .form-group select, .form-group input { width: 100%; padding: 14px 16px; background: rgba(10,12,20,0.8); border: 1px solid rgba(255,0,0,0.3); border-radius: 16px; color: white; font-size: 14px; }
        
        .option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .option-item { background: rgba(10,12,20,0.6); border: 1px solid rgba(255,0,0,0.3); border-radius: 16px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .option-item.selected { background: linear-gradient(135deg, #ff0000, #cc0000); border-color: #ff0000; }
        .option-value { font-size: 18px; font-weight: 700; }
        .option-label { font-size: 10px; opacity: 0.7; }
        
        .price-summary { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 16px; margin-bottom: 20px; text-align: center; }
        .price-amount { font-size: 32px; font-weight: 800; color: #ffd700; }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 40px; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, #ff0000, #cc0000); color: white; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .alert { padding: 14px; border-radius: 16px; margin-bottom: 16px; font-size: 13px; }
        .alert-success { background: rgba(0,255,136,0.1); border: 1px solid #00ff88; color: #00ff88; }
        .alert-error { background: rgba(255,0,0,0.1); border: 1px solid #ff0000; color: #ff0000; }
        
        .history-item { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
        
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .loading-spinner { width: 50px; height: 50px; border: 3px solid rgba(255,0,0,0.2); border-top-color: #ff0000; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .login-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a0f, #0d1117); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: rgba(20,25,40,0.95); backdrop-filter: blur(20px); border-radius: 48px; padding: 40px 24px; text-align: center; border: 1px solid rgba(255,0,0,0.3); max-width: 350px; width: 100%; }
        .login-card input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(10,12,20,0.8); border: 1px solid rgba(255,0,0,0.3); border-radius: 16px; color: white; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar"><span>Nexus Reseller</span><span><i class="fas fa-signal"></i></span></div>
        
        <div id="loginGate" class="login-gate">
            <div class="login-card">
                <div class="app-logo" style="font-size: 32px;">✦ NEXUS</div>
                <p style="margin: 16px 0; color: rgba(255,255,255,0.5);">Reseller Panel Login</p>
                <input type="text" id="resellerUser" placeholder="Username">
                <input type="password" id="resellerPass" placeholder="Password">
                <button class="btn btn-primary" onclick="resellerLogin()">Login</button>
                <div id="loginMsg" style="margin-top: 16px;"></div>
            </div>
        </div>
        
        <div id="mainApp" style="display: none;">
            <div class="app-header"><div class="app-logo">✦ NEXUS RESELLER</div><div class="app-subtitle">Key Management System</div></div>
            
            <div class="coin-card"><div class="coin-balance" id="coinBalance">0</div><div class="coin-label">Your Coin Balance</div></div>
            
            <div class="tab-bar"><div class="tab-item active" onclick="switchTab('create')"><i class="fas fa-plus-circle"></i> Create Key</div><div class="tab-item" onclick="switchTab('history')"><i class="fas fa-history"></i> History</div></div>
            
            <div class="app-content">
                <div id="tabCreate">
                    <div class="card">
                        <div class="card-title"><i class="fas fa-crown"></i> Generate New Key</div>
                        <div class="form-group"><label>Duration</label><div class="option-grid" id="durationOptions"></div></div>
                        <div class="form-group"><label>Device Limit</label><div class="option-grid" id="deviceOptions"></div></div>
                        <div class="form-group"><label><i class="fas fa-lock"></i> Security Binding Type</label><select id="bindingType" class="form-control"><option value="device">🔒 Device Fingerprint (Recommended - Most Secure)</option><option value="ip">🌐 IP Address Lock</option><option value="both">⚡ Both IP & Device (Maximum Security)</option><option value="none">🌍 No Lock (Any device - Insecure)</option></select><small style="color: rgba(255,255,255,0.4);">Device fingerprint locks key to specific browser/device</small>
                         </div>
                        <div class="form-group"><label>Buyer Email (Optional)</label><input type="email" id="buyerEmail" placeholder="customer@example.com"></div>
                        <div class="price-summary"><div id="priceLabel" style="font-size: 12px; margin-bottom: 4px;">Total Price</div><div class="price-amount" id="totalPrice">0</div><div style="font-size: 10px;">Coins</div></div>
                        <button class="btn btn-primary" id="createBtn" onclick="createKey()"><i class="fas fa-key"></i> Create Key</button>
                        <div id="createResult"></div>
                    </div>
                </div>
                
                <div id="tabHistory" style="display: none;">
                    <div class="card"><div class="card-title"><i class="fas fa-list"></i> Transaction History</div><div id="historyList">Loading...</div></div>
                </div>
            </div>
        </div>
        
        <div id="loadingOverlay" class="loading-overlay"><div class="loading-spinner"></div><div style="margin-top: 20px;">Processing...</div></div>
    </div>
    
    <script>
        const API_BASE = 'https://system-nexus-key.vercel.app';
        let currentUserId = null;
        let selectedDuration = 30;
        let selectedDevice = 1;
        let userCoins = 0;
        
        const DURATION_OPTIONS = [
            { days: 1, coins: 5, label: '1 Day' },
            { days: 3, coins: 12, label: '3 Days' },
            { days: 7, coins: 25, label: '7 Days' },
            { days: 15, coins: 45, label: '15 Days' },
            { days: 30, coins: 80, label: '30 Days' }
        ];
        
        const DEVICE_OPTIONS = [
            { limit: 1, extra: 0, label: '1 Device' },
            { limit: 10, extra: 10, label: '10 Devices' },
            { limit: 20, extra: 18, label: '20 Devices' },
            { limit: 30, extra: 25, label: '30 Devices' },
            { limit: 50, extra: 40, label: '50 Devices' }
        ];
        
        function getDurationCoins(days) { return DURATION_OPTIONS.find(d => d.days === days)?.coins || 5; }
        function getDeviceExtra(limit) { return DEVICE_OPTIONS.find(d => d.limit === limit)?.extra || 0; }
        function calculateTotalPrice() { return getDurationCoins(selectedDuration) + getDeviceExtra(selectedDevice); }
        
        // Toggle custom IP input based on binding type
document.getElementById('bindingType')?.addEventListener('change', function() {
    const customGroup = document.getElementById('customIpGroup');
    if (customGroup) {
        customGroup.style.display = (this.value === 'ip' || this.value === 'both') ? 'flex' : 'none';
    }
});

        function updatePriceDisplay() { document.getElementById('totalPrice').innerText = calculateTotalPrice(); }
        
        function renderDurationOptions() {
            document.getElementById('durationOptions').innerHTML = DURATION_OPTIONS.map(opt => `
                <div class="option-item ${selectedDuration === opt.days ? 'selected' : ''}" onclick="selectDuration(${opt.days})">
                    <div class="option-value">${opt.days}</div>
                    <div class="option-label">${opt.label}</div>
                    <div style="font-size: 10px;">💰 ${opt.coins}</div>
                </div>
            `).join('');
        }
        
        function renderDeviceOptions() {
            document.getElementById('deviceOptions').innerHTML = DEVICE_OPTIONS.map(opt => `
                <div class="option-item ${selectedDevice === opt.limit ? 'selected' : ''}" onclick="selectDevice(${opt.limit})">
                    <div class="option-value">${opt.limit}</div>
                    <div class="option-label">${opt.label}</div>
                    <div style="font-size: 10px;">+${opt.extra}</div>
                </div>
            `).join('');
        }
        
        function selectDuration(days) { selectedDuration = days; renderDurationOptions(); updatePriceDisplay(); }
        function selectDevice(limit) { selectedDevice = limit; renderDeviceOptions(); updatePriceDisplay(); }
        
        function showLoading(show) { document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; }
        
        async function resellerLogin() {
            const username = document.getElementById('resellerUser').value;
            const password = document.getElementById('resellerPass').value;
            if (!username || !password) { document.getElementById('loginMsg').innerHTML = '<div class="alert alert-error">Username and password required</div>'; return; }
            showLoading(true);
            try {
                const res = await fetch(`${API_BASE}/api/reseller/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    currentUserId = data.user.user_id;
                    userCoins = data.user.coins;
                    document.getElementById('coinBalance').innerText = userCoins;
                    document.getElementById('loginGate').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    loadHistory();
                    updatePriceDisplay();
                } else {
                    document.getElementById('loginMsg').innerHTML = `<div class="alert alert-error">${data.error}</div>`;
                }
            } catch(err) { document.getElementById('loginMsg').innerHTML = `<div class="alert alert-error">Connection error</div>`; }
            finally { showLoading(false); }
        }
        
        async function createKey() {
    // Ambil nilai dari form
    const buyerEmail = document.getElementById('buyerEmail')?.value || '';
    const bindingType = document.getElementById('bindingType')?.value || 'device';
    const totalPrice = calculateTotalPrice();
    
    // Validasi saldo
    if (userCoins < totalPrice) {
        showAlert('createResult', `❌ Insufficient coins! Need ${totalPrice} coins, you have ${userCoins} coins`, 'error');
        return;
    }
    
    // Konfirmasi sebelum create
    if (!confirm(`Create key with:\n📅 Duration: ${selectedDuration} days\n📱 Device Limit: ${selectedDevice} devices\n🔐 Binding: ${bindingType}\n💰 Price: ${totalPrice} coins\n\nYour balance: ${userCoins} coins\n\nContinue?`)) {
        return;
    }
    
    showLoading(true);
    
    try {
        const response = await fetch(`${API_BASE}/api/reseller/create-key`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                userId: currentUserId,
                durationDays: selectedDuration,
                deviceLimit: selectedDevice,
                buyerEmail: buyerEmail,
                bindingType: bindingType
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            // Update saldo
            userCoins = data.remainingCoins;
            document.getElementById('coinBalance').innerText = userCoins;
            
            // Format binding message
            let bindingMsg = '';
            switch(bindingType) {
                case 'device': bindingMsg = '🔒 Device Fingerprint Lock'; break;
                case 'ip': bindingMsg = '🌐 IP Address Lock'; break;
                case 'both': bindingMsg = '⚡ Both IP & Device Lock'; break;
                case 'none': bindingMsg = '🌍 No Lock (Insecure)'; break;
                default: bindingMsg = '🔒 Device Fingerprint Lock';
            }
            
            showAlert('createResult', `
                ✅ Key created successfully!<br>
                🔑 Key: <strong>${data.key}</strong><br>
                📅 Expires: ${data.expiryFormatted}<br>
                📱 Devices: ${data.deviceLimit}<br>
                🔐 ${bindingMsg}<br>
                💰 Cost: ${data.price} coins<br>
                💎 Remaining: ${data.remainingCoins} coins
            `, 'success');
            
            // Refresh history
            loadHistory();
            
            // Reset form buyer email (optional)
            document.getElementById('buyerEmail').value = '';
            
        } else {
            showAlert('createResult', `❌ ${data.error}`, 'error');
        }
        
    } catch (error) {
        console.error('Create key error:', error);
        showAlert('createResult', `❌ Network error: ${error.message}`, 'error');
    } finally {
        showLoading(false);
    }
}
        
        async function loadHistory() {
            try {
                const res = await fetch(`${API_BASE}/api/reseller/history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUserId })
                });
                const data = await res.json();
                let html = '';
                if (data.keys && data.keys.length > 0) {
                    html += `<div style="margin-bottom: 12px;"><strong>📋 Generated Keys</strong></div>`;
                    data.keys.forEach(k => { html += `<div class="history-item"><div><code>${k.key_text}</code></div><div style="font-size: 11px;">${k.duration_days} days | ${k.max_devices} devices | ${k.price_coins} coins</div><div style="font-size: 10px;">${new Date(k.created_at).toLocaleString()}</div></div>`; });
                }
                if (data.transactions && data.transactions.length > 0) {
                    html += `<div style="margin: 12px 0 8px;"><strong>💰 Coin Transactions</strong></div>`;
                    data.transactions.forEach(t => { html += `<div class="history-item"><div>${t.reason || t.type} <span style="float:right; color:${t.amount > 0 ? '#00ff88' : '#ff0000'}">${t.amount > 0 ? '+' : ''}${t.amount} coins</span></div><div style="font-size: 10px;">${new Date(t.created_at).toLocaleString()}</div></div>`; });
                }
                if (html === '') html = '<div class="alert alert-info">No transactions yet</div>';
                document.getElementById('historyList').innerHTML = html;
            } catch(e) { document.getElementById('historyList').innerHTML = '<div class="alert alert-error">Failed to load history</div>'; }
        }
        
        function showAlert(elementId, message, type) {
            const el = document.getElementById(elementId);
            if (el) { el.innerHTML = `<div class="alert alert-${type}">${message}</div>`; setTimeout(() => { if (el.innerHTML.includes(message)) el.innerHTML = ''; }, 5000); }
        }
        
        function switchTab(tab) {
            const tabCreate = document.getElementById('tabCreate'), tabHistory = document.getElementById('tabHistory'), tabs = document.querySelectorAll('.tab-item');
            if (tab === 'create') { tabCreate.style.display = 'block'; tabHistory.style.display = 'none'; tabs[0].classList.add('active'); tabs[1].classList.remove('active'); }
            else { tabCreate.style.display = 'none'; tabHistory.style.display = 'block'; tabs[0].classList.remove('active'); tabs[1].classList.add('active'); loadHistory(); }
        }
        
        renderDurationOptions(); renderDeviceOptions(); updatePriceDisplay();
        
    </script>
</body>
</html>
