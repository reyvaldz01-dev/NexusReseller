<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nexus | Reseller Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #0d1117 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .app-container { max-width: 500px; margin: 0 auto; min-height: 100vh; position: relative; }
        
        /* Glass */
        .glass {
            background: rgba(15, 25, 35, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 75, 75, 0.2);
        }
        
        /* Header */
        .header { padding: 24px 20px; text-align: center; border-bottom: 1px solid rgba(255,75,75,0.2); }
        .logo { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #ff4b4b, #ff8a8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .subtitle { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        
        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #1a1a2e, #0d0d1a);
            margin: -20px 20px 20px 20px;
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255,75,75,0.3);
        }
        .balance-amount { font-size: 48px; font-weight: 800; color: #ffd700; }
        .balance-label { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
        
        /* Tabs */
        .tabs { display: flex; padding: 8px 20px; gap: 16px; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: rgba(255,255,255,0.5);
            transition: all 0.2s;
        }
        .tab i { margin-right: 8px; }
        .tab.active { background: linear-gradient(135deg, #ff4b4b, #cc3535); color: white; }
        
        /* Content */
        .content { padding: 20px; padding-bottom: 100px; }
        
        /* Cards */
        .card {
            background: rgba(15, 25, 35, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,75,75,0.2);
        }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #ff4b4b; }
        
        /* Forms */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
        .form-group select, .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 15, 25, 0.9);
            border: 1px solid rgba(255,75,75,0.3);
            border-radius: 16px;
            color: white;
            font-size: 14px;
        }
        
        /* Option Grid */
        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .option {
            background: rgba(10, 15, 25, 0.8);
            border: 1px solid rgba(255,75,75,0.3);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option.selected { background: linear-gradient(135deg, #ff4b4b, #cc3535); border-color: #ff4b4b; }
        .option-value { font-size: 18px; font-weight: 700; }
        .option-label { font-size: 10px; opacity: 0.7; }
        
        /* Price Summary */
        .price-summary {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .price-amount { font-size: 32px; font-weight: 800; color: #ffd700; }
        
        /* Button */
        .btn { width: 100%; padding: 16px; border: none; border-radius: 40px; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, #ff4b4b, #cc3535); color: white; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* Alert */
        .alert { padding: 14px; border-radius: 16px; margin-top: 16px; font-size: 13px; }
        .alert-success { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; }
        .alert-error { background: rgba(220, 38, 38, 0.1); border: 1px solid #dc2626; color: #f87171; }
        
        /* History */
        .history-item {
            background: rgba(10, 15, 25, 0.6);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 8px;
        }
        
        /* Login Gate */
        .login-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0f, #0d1117);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(15, 25, 35, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 24px;
            text-align: center;
            border: 1px solid rgba(255,75,75,0.3);
            max-width: 350px;
            width: 100%;
        }
        .login-card input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(10, 15, 25, 0.9);
            border: 1px solid rgba(255,75,75,0.3);
            border-radius: 16px;
            color: white;
        }
        
        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,75,75,0.2); border-top-color: #ff4b4b; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Login Gate -->
        <div id="loginGate" class="login-gate">
            <div class="login-card">
                <div class="logo" style="font-size: 32px;">✦ NEXUS</div>
                <p style="margin: 16px 0; color: rgba(255,255,255,0.5);">Reseller Portal</p>
                <input type="text" id="resellerUser" placeholder="Username">
                <input type="password" id="resellerPass" placeholder="Password">
                <button class="btn btn-primary" onclick="resellerLogin()">Login</button>
                <div id="loginMsg" style="margin-top: 16px;"></div>
            </div>
        </div>
        
        <!-- Main App -->
        <div id="mainApp" style="display: none;">
            <div class="header">
                <div class="logo">✦ NEXUS RESELLER</div>
                <div class="subtitle">Key Management Portal</div>
            </div>
            
            <div class="balance-card">
                <div class="balance-amount" id="coinBalance">0</div>
                <div class="balance-label">Available Coins</div>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('create')"><i class="fas fa-plus-circle"></i> Create</div>
                <div class="tab" onclick="switchTab('history')"><i class="fas fa-history"></i> History</div>
            </div>
            
            <div class="content">
                <!-- Create Tab -->
                <div id="tabCreate">
                    <div class="card">
                        <div class="card-title"><i class="fas fa-crown"></i> Generate Key</div>
                        
                        <div class="form-group">
                            <label>Duration</label>
                            <div class="option-grid" id="durationOptions"></div>
                        </div>
                        
                        <div class="form-group">
                            <label>Device Limit</label>
                            <div class="option-grid" id="deviceOptions"></div>
                        </div>
                        
                        <div class="form-group">
                            <label>Binding Type</label>
                            <select id="bindingType">
                                <option value="device">🔒 Device Fingerprint</option>
                                <option value="ip">🌐 IP Address Lock</option>
                                <option value="both">⚡ Both IP & Device</option>
                                <option value="none">🌍 No Lock</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Buyer Email (Optional)</label>
                            <input type="email" id="buyerEmail" placeholder="customer@example.com">
                        </div>
                        
                        <div class="price-summary">
                            <div style="font-size: 12px; margin-bottom: 4px;">Total Price</div>
                            <div class="price-amount" id="totalPrice">0</div>
                            <div style="font-size: 10px;">Coins</div>
                        </div>
                        
                        <button class="btn btn-primary" id="createBtn" onclick="createKey()">
                            <i class="fas fa-key"></i> Create Key
                        </button>
                        
                        <div id="createResult"></div>
                    </div>
                </div>
                
                <!-- History Tab -->
                <div id="tabHistory" style="display: none;">
                    <div class="card">
                        <div class="card-title"><i class="fas fa-list"></i> Transaction History</div>
                        <div id="historyList">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Loading -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="spinner"></div>
            <div style="margin-top: 20px;">Processing...</div>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://your-server.vercel.app';
        let currentUserId = null;
        let selectedDuration = 30;
        let selectedDevice = 1;
        let userCoins = 0;
        
        const DURATIONS = [
            { days: 1, coins: 5, label: '1 Day' },
            { days: 3, coins: 12, label: '3 Days' },
            { days: 7, coins: 25, label: '7 Days' },
            { days: 15, coins: 45, label: '15 Days' },
            { days: 30, coins: 80, label: '30 Days' }
        ];
        
        const DEVICES = [
            { limit: 1, extra: 0, label: '1 Device' },
            { limit: 10, extra: 10, label: '10 Devices' },
            { limit: 20, extra: 18, label: '20 Devices' },
            { limit: 30, extra: 25, label: '30 Devices' },
            { limit: 50, extra: 40, label: '50 Devices' }
        ];
        
        function getDurationCoins(days) { return DURATIONS.find(d => d.days === days)?.coins || 5; }
        function getDeviceExtra(limit) { return DEVICES.find(d => d.limit === limit)?.extra || 0; }
        function calculateTotalPrice() { return getDurationCoins(selectedDuration) + getDeviceExtra(selectedDevice); }
        
        function updatePriceDisplay() { document.getElementById('totalPrice').innerText = calculateTotalPrice(); }
        
        function renderDurationOptions() {
            document.getElementById('durationOptions').innerHTML = DURATIONS.map(d => `
                <div class="option ${selectedDuration === d.days ? 'selected' : ''}" onclick="selectDuration(${d.days})">
                    <div class="option-value">${d.days}</div>
                    <div class="option-label">${d.label}</div>
                    <div style="font-size: 10px;">💰 ${d.coins}</div>
                </div>
            `).join('');
        }
        
        function renderDeviceOptions() {
            document.getElementById('deviceOptions').innerHTML = DEVICES.map(d => `
                <div class="option ${selectedDevice === d.limit ? 'selected' : ''}" onclick="selectDevice(${d.limit})">
                    <div class="option-value">${d.limit}</div>
                    <div class="option-label">${d.label}</div>
                    <div style="font-size: 10px;">+${d.extra}</div>
                </div>
            `).join('');
        }
        
        function selectDuration(days) { selectedDuration = days; renderDurationOptions(); updatePriceDisplay(); }
        function selectDevice(limit) { selectedDevice = limit; renderDeviceOptions(); updatePriceDisplay(); }
        
        function showLoading(show) { document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; }
        
        async function resellerLogin() {
            const username = document.getElementById('resellerUser').value;
            const password = document.getElementById('resellerPass').value;
            if (!username || !password) { document.getElementById('loginMsg').innerHTML = '<div class="alert alert-error">Username and password required</div>'; return; }
            
            showLoading(true);
            try {
                const res = await fetch(`${API_BASE}/api/reseller/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await res.json();
                if (data.success) {
                    currentUserId = data.user.user_id;
                    userCoins = data.user.coins;
                    document.getElementById('coinBalance').innerText = userCoins;
                    document.getElementById('loginGate').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    loadHistory();
                    updatePriceDisplay();
                } else { document.getElementById('loginMsg').innerHTML = `<div class="alert alert-error">${data.error}</div>`; }
            } catch(err) { document.getElementById('loginMsg').innerHTML = '<div class="alert alert-error">Connection error</div>'; }
            finally { showLoading(false); }
        }
        
        async function createKey() {
            const buyerEmail = document.getElementById('buyerEmail').value;
            const bindingType = document.getElementById('bindingType').value;
            const totalPrice = calculateTotalPrice();
            
            if (userCoins < totalPrice) {
                document.getElementById('createResult').innerHTML = `<div class="alert alert-error">Insufficient coins! Need ${totalPrice}, you have ${userCoins}</div>`;
                return;
            }
            
            showLoading(true);
            try {
                const res = await fetch(`${API_BASE}/api/reseller/create-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUserId, durationDays: selectedDuration, deviceLimit: selectedDevice, buyerEmail, bindingType })
                });
                const data = await res.json();
                if (data.success) {
                    userCoins = data.remainingCoins;
                    document.getElementById('coinBalance').innerText = userCoins;
                    document.getElementById('createResult').innerHTML = `
                        <div class="alert alert-success">
                            ✅ Key created successfully!<br>
                            🔑 <strong>${data.key}</strong><br>
                            📅 Expires: ${data.expiryFormatted}<br>
                            💰 Cost: ${data.price} coins<br>
                            💎 Remaining: ${data.remainingCoins} coins
                        </div>
                    `;
                    loadHistory();
                } else { document.getElementById('createResult').innerHTML = `<div class="alert alert-error">${data.error}</div>`; }
            } catch(err) { document.getElementById('createResult').innerHTML = '<div class="alert alert-error">Network error</div>'; }
            finally { showLoading(false); }
        }
        
        async function loadHistory() {
            try {
                const res = await fetch(`${API_BASE}/api/reseller/history`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUserId }) });
                const data = await res.json();
                let html = '';
                if (data.keys?.length) {
                    html += '<div style="margin-bottom: 12px;"><strong>📋 Generated Keys</strong></div>';
                    data.keys.forEach(k => {
                        html += `<div class="history-item"><div><code>${k.key_text}</code></div><div style="font-size: 11px;">${k.duration_days}d | ${k.max_devices}d | ${k.price_coins} coins</div><div style="font-size: 10px;">${new Date(k.created_at).toLocaleString()}</div></div>`;
                    });
                }
                if (data.transactions?.length) {
                    html += '<div style="margin: 16px 0 8px;"><strong>💰 Coin Transactions</strong></div>';
                    data.transactions.forEach(t => {
                        html += `<div class="history-item"><div>${t.reason || t.type} <span style="float:right; color:${t.amount > 0 ? '#10b981' : '#ef4444'}">${t.amount > 0 ? '+' : ''}${t.amount}</span></div><div style="font-size: 10px;">${new Date(t.created_at).toLocaleString()}</div></div>`;
                    });
                }
                if (!html) html = '<div class="alert">No transactions yet</div>';
                document.getElementById('historyList').innerHTML = html;
            } catch(e) { document.getElementById('historyList').innerHTML = '<div class="alert alert-error">Failed to load history</div>'; }
        }
        
        function switchTab(tab) {
            const tabCreate = document.getElementById('tabCreate'), tabHistory = document.getElementById('tabHistory'), tabs = document.querySelectorAll('.tab');
            if (tab === 'create') { tabCreate.style.display = 'block'; tabHistory.style.display = 'none'; tabs[0].classList.add('active'); tabs[1].classList.remove('active'); }
            else { tabCreate.style.display = 'none'; tabHistory.style.display = 'block'; tabs[0].classList.remove('active'); tabs[1].classList.add('active'); loadHistory(); }
        }
        
        renderDurationOptions();
        renderDeviceOptions();
        updatePriceDisplay();
    </script>
</body>
</html>
